org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Не качать тулчейн JVM: сборка идёт на установленной Java 17, её достаточно
org.gradle.java.installations.auto-download=false
# Демон на JBR из Android Studio: dex-упаковщик требует тулчейн 25,
# и он резолвится локально без скачивания.
# Путь к JDK — машинозависимый, поэтому живёт в %USERPROFILE%/.gradle/gradle.properties:
#   org.gradle.java.home=C:/ProgRamS/Android/Android Studio/jbr
#   org.gradle.java.installations.paths=C:/ProgRamS/Android/Android Studio/jbr
# Этот файл остаётся переносимым между машинами.
